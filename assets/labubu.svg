  <ellipse cx="98" cy="40" rx="15" ry="38" transform="rotate(12 98 40)" fill="#3FA34D" stroke="#1F6B2A" stroke-width="3"/>
  <ellipse cx="43" cy="44" rx="6.5" ry="25" transform="rotate(-12 43 44)" fill="#F7C6D9"/>
  <ellipse cx="97" cy="44" rx="6.5" ry="25" transform="rotate(12 97 44)" fill="#F7C6D9"/>
  <!-- body and feet -->
  <path d="M38 132 Q36 170 50 178 L90 178 Q104 170 102 132 Z" fill="#3FA34D" stroke="#1F6B2A" stroke-width="3"/>
  <ellipse cx="54" cy="180" rx="14" ry="7" fill="#2F8A3C" stroke="#1F6B2A" stroke-width="3"/>
  <ellipse cx="86" cy="180" rx="14" ry="7" fill="#2F8A3C" stroke="#1F6B2A" stroke-width="3"/>
