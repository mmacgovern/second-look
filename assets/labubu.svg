  <ellipse cx="94" cy="102" rx="5" ry="3" fill="#F2A7B8" opacity="0.8"/>
  <!-- toothy grin -->
  <path d="M50 104 Q70 124 90 104 Z" fill="#7A1F2B" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M51 104.5 L54 110 L57 106 L60 112 L63 107.5 L66.5 113.5 L70 108 L73.5 113.5 L77 107.5 L80 112 L83 106 L86 110 L89 104.5 Z"
