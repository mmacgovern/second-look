  <ellipse cx="106" cy="146" rx="8" ry="14" transform="rotate(-20 106 146)" fill="#3FA34D" stroke="#1F6B2A" stroke-width="3"/>
  <!-- furry head -->
  <path d="M70 52 l7 6 9-3 5 8 10 1 2 9 9 4-1 10 7 7-4 9 4 9-7 6 0 10-9 4-3 9-10 0-6 7-9-4-8 5-8-5-9 4-6-7-10 0-3-9-9-4 0-10-7-6 4-9-4-9 7-7-1-10 9-4 2-9 10-1 5-8 9 3 z"
