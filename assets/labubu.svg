  <!-- pale face -->
  <ellipse cx="70" cy="98" rx="33" ry="27" fill="#F4E6D2" stroke="#1F6B2A" stroke-width="2"/>
  <!-- eyes -->
  <ellipse cx="56" cy="90" rx="8" ry="9.5" fill="#1A1A1A"/>
  <ellipse cx="84" cy="90" rx="8" ry="9.5" fill="#1A1A1A"/>
  <circle cx="58.5" cy="86.5" r="2.8" fill="#FFFFFF"/>
