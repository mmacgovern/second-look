[theme]
base = "dark"
primaryColor = "#D4AF37"              # the one accent: gold
backgroundColor = "#0A0A0A"           # near-black page
secondaryBackgroundColor = "#161616"
textColor = "#F5F1E6"                 # warm off-white
font = "sans serif"
borderColor = "#2E2A1E"
showWidgetBorder = true
baseRadius = "0.6rem"

[theme.sidebar]
backgroundColor = "#000000"
textColor = "#F5F1E6"
secondaryBackgroundColor = "#161616"

[server]
headless = false   # open the browser on "streamlit run app.py"; scripts/run_app.py passes true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
